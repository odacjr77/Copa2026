<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0d1b2e" />
  <title>Copa do Mundo 2026</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="topo">
    <div class="topo-inner">
      <div class="topo-logo">
        <span class="trofeu">🏆</span>
        <div>
          <h1>Copa do Mundo 2026</h1>
          <p class="subtitulo">EUA · Canadá · México &nbsp;|&nbsp; 11 jun – 19 jul</p>
        </div>
      </div>
    </div>
    <nav class="abas-nav">
      <button class="btn-aba ativa" onclick="mostrarAba('jogos', this)">⚽ Jogos</button>
      <button class="btn-aba" onclick="mostrarAba('grupos', this)">🌐 Grupos</button>
      <button class="btn-aba" onclick="mostrarAba('classificacao', this)">📊 Classificação</button>
      <button class="btn-aba" onclick="mostrarAba('matamata', this)">🏅 Mata-Mata</button>
    </nav>
  </header>

  <main>

    <!-- ── ABA JOGOS ──────────────────────────────────────── -->
    <section id="aba-jogos" class="conteudo-aba ativa">
      <button id="btn-anteriores" class="btn-anteriores">
        ↑ Ver jogos anteriores
      </button>
      <div id="lista-jogos">
        <!-- dias injetados pelo JS -->
        <div id="sentinel" class="sentinel">
          <span class="loading-dots"><span></span><span></span><span></span></span>
        </div>
      </div>
    </section>

    <!-- ── ABA GRUPOS ─────────────────────────────────────── -->
    <section id="aba-grupos" class="conteudo-aba">
      <h2 class="titulo-secao">Fase de Grupos</h2>
      <p class="subtitulo-secao">48 seleções · 12 grupos · 2 classificados por grupo + 8 melhores 3ºs</p>
      <div id="grade-grupos" class="grade-grupos"></div>
    </section>

    <!-- ── ABA CLASSIFICAÇÃO ──────────────────────────────── -->
    <section id="aba-classificacao" class="conteudo-aba">
      <h2 class="titulo-secao">Classificação</h2>
      <div class="filtro-grupo">
        <label for="sel-grupo">Selecionar grupo:</label>
        <select id="sel-grupo"></select>
      </div>
      <div id="tabela-classificacao"></div>
    </section>

    <!-- ── ABA MATA-MATA ──────────────────────────────────── -->
    <section id="aba-matamata" class="conteudo-aba">
      <h2 class="titulo-secao">Mata-Mata</h2>
      <div id="bracket"></div>
    </section>

  </main>

  <footer>
    <p>Copa do Mundo FIFA 2026 · Horários em BRT (Brasília, UTC-3)</p>
  </footer>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
