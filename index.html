<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0d1b2e" />
  <title>Copa do Mundo 2026</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="topo">
    <div class="topo-inner">
      <div class="topo-logo">
        <span class="trofeu">🏆</span>
        <div>
          <h1>Copa do Mundo 2026</h1>
          <p class="subtitulo">EUA · Canadá · México &nbsp;|&nbsp; 11 jun – 19 jul</p>
        </div>
      </div>
    </div>
    <nav class="abas-nav">
      <button class="btn-aba ativa" onclick="mostrarAba('jogos', this)">⚽ Jogos</button>
      <button class="btn-aba" onclick="mostrarAba('classificacao', this)">📊 Classificação</button>
      <button class="btn-aba" onclick="mostrarAba('matamata', this)">🏅 Mata-Mata</button>
      <button class="btn-aba" onclick="window.location.href='bolao.html'">🏇 Bolão</button>
    </nav>
  </header>

  <main>

    <!-- ── ABA JOGOS ──────────────────────────────────────── -->
    <section id="aba-jogos" class="conteudo-aba ativa">
      <button id="btn-anteriores" class="btn-anteriores">
        ↑ Ver jogos anteriores
      </button>
      <div id="lista-jogos">
        <p id="msg-carregando" class="msg-carregando">
          <span class="loading-dots"><span></span><span></span><span></span></span>
          Carregando jogos...
        </p>
        <!-- dias injetados pelo JS -->
      </div>
      <!-- sentinel fora do lista-jogos para não ser apagado ao recarregar -->
      <div id="sentinel" class="sentinel">
        <button class="btn-ver-mais" id="btn-ver-mais">
          <span class="seta">⬇</span> Ver mais jogos
        </button>
      </div>
    </section>

    <!-- ── ABA CLASSIFICAÇÃO ──────────────────────────────── -->
    <section id="aba-classificacao" class="conteudo-aba">
      <h2 class="titulo-secao">Classificação por Grupo</h2>
      <p class="subtitulo-secao">48 seleções · 12 grupos · 2 classificados + 8 melhores 3ºs avançam</p>
      <div id="grade-classificacao" class="grade-classificacao"></div>
      <p class="legenda" style="padding: 0 12px 16px">🟦 Os 2 primeiros de cada grupo se classificam</p>
    </section>

    <!-- ── ABA MATA-MATA ──────────────────────────────────── -->
    <section id="aba-matamata" class="conteudo-aba">
      <h2 class="titulo-secao">Mata-Mata</h2>
      <div id="bracket"></div>
    </section>

  </main>

  <footer>
    <p>Copa do Mundo FIFA 2026 · Horários em BRT (Brasília, UTC-3)</p>
    <p id="ultima-atualizacao" class="ultima-atualizacao"></p>
  </footer>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
