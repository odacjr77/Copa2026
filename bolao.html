<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0d1b2e">
  <title>Bolão · Copa 2026</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* ── Layout ───────────────────────────────────────────── */
    .bolao-wrap {
      max-width: 900px;
      margin: 0 auto;
      padding: 16px 12px 60px;
    }

    /* ── Loading / Error ──────────────────────────────────── */
    .estado-central {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 60px 20px;
      color: #546e7a;
      font-size: 0.9rem;
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid #1e3a5f;
      border-top-color: #1565c0;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Round banner ─────────────────────────────────────── */
    .round-banner {
      text-align: center;
      padding: 16px 12px;
      background: #131929;
      border: 1px solid #1e3a5f;
      border-radius: 14px;
      margin-bottom: 14px;
    }
    .round-title {
      font-size: 1.4rem;
      font-weight: 800;
      color: #64b5f6;
      margin: 0; padding: 0; border: none;
    }
    .round-sub {
      color: #90caf9;
      font-size: 0.82rem;
      margin-top: 5px;
    }

    /* ── Progress pills ───────────────────────────────────── */
    .prog-pills {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px;
      margin-bottom: 16px;
    }
    .prog-pill {
      padding: 5px 12px;
      border-radius: 20px;
      background: #131929;
      border: 1px solid #1e3a5f;
      color: #546e7a;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, color 0.2s, border-color 0.2s;
    }
    .prog-pill.active {
      background: #1565c0;
      border-color: #1976d2;
      color: #fff;
    }

    /* ── Race track ───────────────────────────────────────── */
    .race-wrap {
      position: relative;
      width: 100%;
      margin-bottom: 24px;
    }

    /* ── Player lane ──────────────────────────────────────── */
    .player-lane {
      position: absolute;
      left: 0; width: 100%;
      height: 48px;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: top 1.1s cubic-bezier(0.34, 1.4, 0.64, 1);
    }

    .p-rank {
      width: 28px;
      text-align: center;
      font-size: 0.72rem;
      font-weight: 800;
      color: #546e7a;
      flex-shrink: 0;
      transition: color 0.5s;
    }
    .p-rank.gold   { color: #FFD700; }
    .p-rank.silver { color: #C0C0C0; }
    .p-rank.bronze { color: #CD7F32; }

    .p-badge {
      width: 30px; height: 30px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      border: 2px solid transparent;
      overflow: hidden;
    }
    .p-badge img {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
    }

    .p-name {
      width: 80px;
      font-size: 0.72rem;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex-shrink: 0;
    }

    .p-bar-outer {
      flex: 1;
      height: 24px;
      background: rgba(255,255,255,0.04);
      border-radius: 12px;
      position: relative;
      overflow: visible;
    }
    .p-bar-inner {
      height: 100%;
      border-radius: 12px;
      width: 0%;
      transition: width 1.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }

    /* horse riding the bar */
    .p-horse-wrap {
      position: absolute;
      top: 50%; left: 0%;
      transform: translateY(-50%);
      transition: left 1.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      z-index: 5;
      pointer-events: none;
    }
    .horse-svg-wrap {
      display: block;
      animation: galope 0.35s ease-in-out infinite alternate;
      filter: drop-shadow(0 2px 3px rgba(0,0,0,0.5));
    }
    @keyframes galope {
      from { transform: translateY(-2px) rotate(-6deg); }
      to   { transform: translateY(2px)  rotate(6deg); }
    }

    /* face photo riding the bar */
    .face-wrap {
      display: block;
      width: 34px; height: 34px;
      border-radius: 50%;
      overflow: hidden;
      border: 2px solid var(--face-cor, #fff);
      box-shadow: 0 2px 5px rgba(0,0,0,0.5);
      animation: pulo 0.35s ease-in-out infinite alternate;
      filter: drop-shadow(0 2px 3px rgba(0,0,0,0.5));
    }
    @keyframes pulo {
      from { transform: translateY(-3px); }
      to   { transform: translateY(3px); }
    }
    .face-wrap img {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
    }

    /* emoji marker riding the bar */
    .emoji-marcador {
      width: 34px; height: 34px;
      border-radius: 50%;
      border: 2px solid var(--face-cor, #fff);
      box-shadow: 0 2px 5px rgba(0,0,0,0.5);
      animation: pulo 0.35s ease-in-out infinite alternate;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      line-height: 1;
    }

    .p-score {
      width: 32px;
      text-align: right;
      font-size: 0.88rem;
      font-weight: 800;
      flex-shrink: 0;
    }

    /* ── Replay controls ──────────────────────────────────── */
    .bolao-controls {
      margin-top: 8px;
      border-top: 1px solid #1e3a5f;
      padding-top: 16px;
    }

    /* progress bar */
    .progress-container {
      width: 100%;
      height: 6px;
      background: #1e3a5f;
      border-radius: 3px;
      overflow: hidden;
      margin-bottom: 14px;
    }
    .progress-bar {
      height: 100%;
      width: 0%;
      border-radius: 3px;
      background: linear-gradient(90deg, #1565c0, #42a5f5, #f9a825);
      background-size: 200% 100%;
      animation: none;
    }
    @keyframes progressAnim {
      0%   { width: 0%;   background-position: 0% 50%; }
      100% { width: 100%; background-position: 100% 50%; }
    }

    /* buttons row */
    .btn-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
    }
    .bolao-btn {
      padding: 10px 20px;
      background: #1565c0;
      border: 1px solid #1976d2;
      color: #fff;
      font-size: 0.88rem;
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s, opacity 0.2s;
    }
    .bolao-btn:hover:not(:disabled)  { background: #1976d2; transform: translateY(-1px); }
    .bolao-btn:active:not(:disabled) { transform: translateY(0); }
    .bolao-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .bolao-btn.btn-secondary {
      background: transparent;
      border-color: #1e3a5f;
      color: #90caf9;
    }
    .bolao-btn.btn-secondary:hover:not(:disabled) {
      background: #1e3a5f;
    }
    .btn-replay-grande {
      font-size: 1rem;
      padding: 12px 28px;
      letter-spacing: 0.3px;
    }

    /* fonte da última atualização */
    .fonte-dados {
      text-align: center;
      font-size: 0.7rem;
      color: #37474f;
      margin-top: 10px;
    }

    /* ── Tablet 600px+ ────────────────────────────────────── */
    @media (min-width: 600px) {
      .bolao-wrap { padding: 20px 24px 60px; }
      .round-title { font-size: 1.7rem; }
      .p-name { width: 100px; font-size: 0.78rem; }
      .p-badge { width: 34px; height: 34px; }
      .p-score { width: 38px; font-size: 0.95rem; }
      .player-lane { gap: 8px; height: 52px; }
    }

    @media (min-width: 900px) {
      .bolao-wrap { padding: 24px 0 60px; }
    }
  </style>
</head>
<body>

  <!-- ── Header ──────────────────────────────────────────── -->
  <header class="topo">
    <div class="topo-inner">
      <div class="topo-logo">
        <span class="trofeu">🏆</span>
        <div>
          <h1>Copa do Mundo 2026</h1>
          <p class="subtitulo">EUA · Canadá · México &nbsp;|&nbsp; 11 jun – 19 jul</p>
        </div>
      </div>
    </div>
    <nav class="abas-nav">
      <button class="btn-aba" onclick="location.href='index.html'">⚽ Jogos</button>
      <button class="btn-aba" onclick="location.href='index.html'">📊 Grupos</button>
      <button class="btn-aba" onclick="location.href='index.html'">🏅 Mata-Mata</button>
      <button class="btn-aba ativa">🏇 Bolão</button>
    </nav>
  </header>

  <main>
    <div class="bolao-wrap">

      <!-- Estado: carregando -->
      <div id="stateLoading" class="estado-central">
        <div class="spinner"></div>
        <p>Carregando dados do bolão...</p>
      </div>

      <!-- Estado: erro -->
      <div id="stateError" class="estado-central" style="display:none">
        <span style="font-size:2rem">⚠️</span>
        <p id="errorMsg">Não foi possível carregar os dados da planilha.</p>
        <button class="bolao-btn" onclick="init()">Tentar novamente</button>
      </div>

      <!-- Conteúdo principal -->
      <div id="stateMain" style="display:none">

        <div class="round-banner">
          <h2 class="round-title" id="rTitle">—</h2>
          <p  class="round-sub"   id="rSub"></p>
        </div>

        <div class="prog-pills" id="progPills"></div>
        <div class="race-wrap"  id="raceWrap"></div>

        <div class="bolao-controls">
          <div class="progress-container">
            <div class="progress-bar" id="progressBar"></div>
          </div>
          <div class="btn-row">
            <button class="bolao-btn btn-replay-grande" id="btnReplay" onclick="iniciarReplay()">
              🔄 Refazer Animação
            </button>
            <button class="bolao-btn btn-secondary" onclick="navStep(-1)">◀ Anterior</button>
            <button class="bolao-btn btn-secondary" onclick="navStep(1)">Próxima ▶</button>
          </div>
        </div>

        <p class="fonte-dados">
          Dados: <a href="https://docs.google.com/spreadsheets/d/15doR2R2qaBXsiH-xrekydCPEsldxUKvg99EYAOiblyU"
                    target="_blank" rel="noopener" style="color:#37474f">Google Sheets · aba bolao</a>
        </p>
      </div>

    </div>
  </main>

  <footer>
    <p>Copa do Mundo FIFA 2026 · Horários em BRT (Brasília, UTC-3)</p>
  </footer>

  <script>
  // ── Configuração ─────────────────────────────────────────
  const SHEET_ID      = '15doR2R2qaBXsiH-xrekydCPEsldxUKvg99EYAOiblyU';
  const ANIM_TOTAL_MS = 15000;   // duração total da animação
  const CSS_TRANS_MS  = 1400;    // duração da transição CSS (largura da barra)
  const ROW_H         = 52;      // altura de cada linha (px) — mobile
  const ROW_H_LARGE   = 52;

  // Cores fixas por nome; novos jogadores recebem cores automáticas
  const CORES_JOGADORES = {
    'Vitor':       '#ef5350',
    'Juarez':      '#ff8f00',
    'João Felipe': '#fdd835',
    'Leandro':     '#66bb6a',
    'Bixiga':      '#26c6da',
    'Odair':       '#42a5f5',
    'Aloisio':     '#ab47bc',
    'Tuk':         '#f06292',
    'Pileggi':     '#ff7043',
    'Barretos':    '#8d6e63',
    'Rafa':        '#78909c',
    'Coração':     '#e53935',
    'Irineu':      '#43a047',
    'Fabio':       '#1e88e5',
    'Bob':         '#8e24aa',
    'Bryan':       '#ffb300',
    'Pedro':       '#00897b',
  };
  const CORES_AUTO = [
    '#e91e63','#00bcd4','#8bc34a','#ff5722','#607d8b',
    '#9e9e9e','#795548','#009688','#3f51b5','#cddc39',
  ];

  // Ícones dos jogadores (emoji ou caminho de imagem)
  const ICONES_JOGADORES = {
    'Juarez':        '🪶',    // pena de índio
    'Vitor':         '😆',    // Beavis
    'Odair':         '😎',    // óculos escuro
    'João Felipe':   '🤨',    // Butt-Head
    'Coração':       '🤥',    // Pinóquio (nariz longo)
    'Barretos':      '🤠',    // chapéu de cowboy
    'Bixiga':        '🎈',    // bexiga
    'Pileggi':       '🐴',    // cavalo
    'Fabio':         '😭',    // homem careca gordinho chorando
    'Aloisio':       '🦆',    // pato
    'Leandro':       '🦀',    // siri
    'Tuk':           '🔪',    // Chucky boneco assassino
    'Rafa':          '🏴',    // bandeira (RS — sem emoji oficial de estado)
    'Bryan':         '🐶',    // Brian (Family Guy)
    'Bob':           '🧽',    // Bob Esponja
    'Irineu':        '🌺',    // camisa florida
    'Pedro':         '🐕',    // cachorro
    'Julia':         '🐕',    // cachorra
    'Isa e Heleana': '🐕🐕',  // 2 cachorros juntos
  };

  // ── Estado global ────────────────────────────────────────
  let PLAYERS  = [];   // [{ name, color }]
  let ROUNDS   = [];   // [{ title, sub, scores[] }]
  let MAX_SCORE = 100;
  let curRound  = 0;
  let timers    = [];

  // ── Parser CSV simples ───────────────────────────────────
  function parseCSV(text) {
    return text.trim().split(/\r?\n/).map(line => {
      const cols = [];
      let field = '', inQ = false;
      for (let i = 0; i < line.length; i++) {
        const c = line[i];
        if (c === '"') {
          if (inQ && line[i + 1] === '"') { field += '"'; i++; }
          else inQ = !inQ;
        } else if (c === ',' && !inQ) {
          cols.push(field); field = '';
        } else {
          field += c;
        }
      }
      cols.push(field);
      return cols;
    });
  }

  // ── Busca e monta dados da planilha ──────────────────────
  async function carregarDados() {
    const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=bolao`;
    const resp = await fetch(url);
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const text = await resp.text();
    const rows = parseCSV(text);

    // Linhas: 0=cabeçalho de rodadas, 1=rótulos subtotal, 2="Jogador", 3+=dados
    const dataRows = rows.slice(3).filter(r => r[0] && r[0].trim());

    let autoColorIdx = 0;
    const playerData = dataRows.map(row => {
      // Limpa typos como "Fabio]"
      const name  = row[0].replace(/[\[\]]/g, '').trim();
      const color = CORES_JOGADORES[name] || CORES_AUTO[autoColorIdx++ % CORES_AUTO.length];

      // Colunas pares (2,4,6,...) = acumulado após cada rodada
      const scores = [];
      for (let r = 1; r <= 20; r++) {
        const col = r * 2;
        if (col < row.length && row[col] !== '') {
          scores.push(parseInt(row[col]) || 0);
        }
      }
      return { name, color, scores };
    });

    // Quantas rodadas têm dados?
    const numRodadas = Math.max(...playerData.map(p => p.scores.length), 0);

    // Popula variáveis globais
    PLAYERS = playerData.map(p => ({ name: p.name, color: p.color }));

    ROUNDS = [
      {
        title: 'Largada! 🏁',
        sub:   'Todos com 0 pontos — que comecem os jogos!',
        scores: PLAYERS.map(() => 0),
      }
    ];

    for (let r = 0; r < numRodadas; r++) {
      const isLast = r === numRodadas - 1;
      ROUNDS.push({
        title:  `Após Rodada ${r + 1}${isLast ? ' 🏆' : ''}`,
        sub:    isLast
                  ? 'Classificação atual'
                  : `Pontuação acumulada após ${r + 1} rodada${r + 1 > 1 ? 's' : ''}`,
        scores: playerData.map(p => p.scores[r] || 0),
      });
    }

    MAX_SCORE = Math.max(...ROUNDS.flatMap(r => r.scores), 10);
  }

  // ── Cálculo automático de timings ────────────────────────
  // Distribui as N transições uniformemente em ANIM_TOTAL_MS,
  // garantindo que a última termine exatamente em ANIM_TOTAL_MS.
  function calcTimings() {
    const n = ROUNDS.length - 1;   // número de transições
    if (n === 0) return [];

    const firstMs = 800;                          // pausa inicial antes da 1ª transição
    const lastMs  = ANIM_TOTAL_MS - CSS_TRANS_MS; // última transição termina em 15 s

    if (n === 1) return [Math.round((firstMs + lastMs) / 2)];

    const step = (lastMs - firstMs) / (n - 1);
    return Array.from({ length: n }, (_, i) => Math.round(firstMs + step * i));
  }

  // ── SVG cavalinho ─────────────────────────────────────────
  function horseSVG(cor, size) {
    return `<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg"
              fill="${cor}" width="${size}" height="${size}">
      <ellipse cx="30" cy="38" rx="18" ry="10"/>
      <polygon points="42,32 50,16 56,20 48,34"/>
      <ellipse cx="54" cy="14" rx="8" ry="6" transform="rotate(-10,54,14)"/>
      <rect x="59" y="13" width="5" height="4" rx="2"/>
      <circle cx="56" cy="11" r="1.5" fill="white"/>
      <circle cx="56.5" cy="11" r="0.7" fill="#222"/>
      <polygon points="50,9 53,4 55,9"/>
      <path d="M48 16 Q44 8 46 20" stroke="${cor}" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <path d="M13 36 Q4 30 6 44 Q10 50 14 46" stroke="${cor}" stroke-width="3" fill="none" stroke-linecap="round"/>
      <rect x="20" y="46" width="5" height="14" rx="2"/>
      <rect x="28" y="47" width="5" height="13" rx="2"/>
      <rect x="37" y="47" width="5" height="13" rx="2"/>
      <rect x="44" y="46" width="5" height="14" rx="2"/>
      <rect x="19" y="58" width="7" height="3" rx="1.5" fill="#333"/>
      <rect x="27" y="58" width="7" height="3" rx="1.5" fill="#333"/>
      <rect x="36" y="58" width="7" height="3" rx="1.5" fill="#333"/>
      <rect x="43" y="58" width="7" height="3" rx="1.5" fill="#333"/>
    </svg>`;
  }

  // ── Monta DOM ─────────────────────────────────────────────
  function buildDOM() {
    const raceWrap = document.getElementById('raceWrap');
    const pills    = document.getElementById('progPills');
    raceWrap.innerHTML = '';
    pills.innerHTML    = '';

    raceWrap.style.height = `${PLAYERS.length * ROW_H + 6}px`;

    // Pills de navegação
    ROUNDS.forEach((_, i) => {
      const p = document.createElement('button');
      p.className   = 'prog-pill' + (i === 0 ? ' active' : '');
      p.id          = `pill-${i}`;
      p.textContent = i === 0 ? 'Início' : `Rod. ${i}`;
      p.onclick     = () => { clearTimers(); stopProgress(); setRound(i); };
      pills.appendChild(p);
    });

    // Lanes dos jogadores
    PLAYERS.forEach((p, i) => {
      const lane = document.createElement('div');
      lane.className = 'player-lane';
      lane.id        = `lane-${i}`;
      lane.style.top = `${i * ROW_H}px`;

      const icone   = ICONES_JOGADORES[p.name];
      const isEmoji = icone && !icone.includes('/');
      let badgeHTML, marcadorHTML;
      if (icone && isEmoji) {
        badgeHTML    = `<span style="font-size:17px;line-height:1">${icone}</span>`;
        marcadorHTML = `<div class="emoji-marcador" style="--face-cor:${p.color}">${icone}</div>`;
      } else if (icone) {
        badgeHTML    = `<img src="${icone}" alt="${p.name}">`;
        marcadorHTML = `<div class="face-wrap" style="--face-cor:${p.color}"><img src="${icone}" alt="${p.name}"></div>`;
      } else {
        badgeHTML    = horseSVG(p.color, 20);
        marcadorHTML = `<div class="horse-svg-wrap">${horseSVG(p.color, 30)}</div>`;
      }

      lane.innerHTML = `
        <div class="p-rank" id="rank-${i}">—</div>
        <div class="p-badge" style="background:${p.color}22;border-color:${p.color}">
          ${badgeHTML}
        </div>
        <div class="p-name" style="color:${p.color}">${p.name}</div>
        <div class="p-bar-outer" id="outer-${i}">
          <div class="p-bar-inner" id="bar-${i}"
               style="background:linear-gradient(90deg,${p.color}55,${p.color}dd)"></div>
          <div class="p-horse-wrap" id="horse-${i}">
            ${marcadorHTML}
          </div>
        </div>
        <div class="p-score" id="score-${i}" style="color:${p.color}">0</div>`;

      raceWrap.appendChild(lane);
    });
  }

  // ── Aplica rodada ─────────────────────────────────────────
  function setRound(idx) {
    curRound = idx;
    const round = ROUNDS[idx];

    document.getElementById('rTitle').textContent = round.title;
    document.getElementById('rSub').textContent   = round.sub;

    ROUNDS.forEach((_, i) => {
      document.getElementById(`pill-${i}`).className =
        'prog-pill' + (i === idx ? ' active' : '');
    });

    const ranked = round.scores
      .map((s, i) => ({ i, s, name: PLAYERS[i].name }))
      .sort((a, b) => b.s - a.s || a.name.localeCompare(b.name));

    ranked.forEach(({ i: pi, s }, rank) => {
      document.getElementById(`lane-${pi}`).style.top = `${rank * ROW_H}px`;

      const pct = s === 0 ? 0 : Math.max(2, (s / MAX_SCORE) * 100);
      document.getElementById(`bar-${pi}`).style.width  = `${pct}%`;
      document.getElementById(`horse-${pi}`).style.left = `${pct}%`;
      document.getElementById(`score-${pi}`).textContent = s;

      const medals = ['gold', 'silver', 'bronze'];
      const rankEl = document.getElementById(`rank-${pi}`);
      rankEl.className    = 'p-rank' + (rank < 3 ? ` ${medals[rank]}` : '');
      rankEl.textContent  = `#${rank + 1}`;
    });
  }

  // ── Barra de progresso ────────────────────────────────────
  function startProgress() {
    const bar = document.getElementById('progressBar');
    bar.style.animation = 'none';
    bar.offsetWidth; // force reflow
    bar.style.animation = `progressAnim ${ANIM_TOTAL_MS}ms linear forwards`;
  }
  function stopProgress() {
    document.getElementById('progressBar').style.animation = 'none';
  }

  // ── Replay ────────────────────────────────────────────────
  function clearTimers() {
    timers.forEach(clearTimeout);
    timers = [];
  }

  function iniciarReplay() {
    clearTimers();
    stopProgress();
    setRound(0);
    startProgress();

    const btn = document.getElementById('btnReplay');
    btn.disabled    = true;
    btn.textContent = '⏳ Animando…';

    const timings = calcTimings();

    // Loga os timings para debug (console)
    console.log(
      `[Bolão] ${ROUNDS.length - 1} transições em ${ANIM_TOTAL_MS / 1000}s`,
      timings.map((t, i) => `Rod.${i + 1}→${(t / 1000).toFixed(1)}s`)
    );

    timings.forEach((delay, i) => {
      timers.push(setTimeout(() => setRound(i + 1), delay));
    });

    timers.push(setTimeout(() => {
      btn.disabled    = false;
      btn.textContent = '🔄 Refazer Animação';
    }, ANIM_TOTAL_MS));
  }

  function navStep(delta) {
    clearTimers();
    stopProgress();
    setRound(Math.max(0, Math.min(ROUNDS.length - 1, curRound + delta)));
  }

  // ── Init ──────────────────────────────────────────────────
  async function init() {
    const elLoading = document.getElementById('stateLoading');
    const elError   = document.getElementById('stateError');
    const elMain    = document.getElementById('stateMain');

    elLoading.style.display = 'flex';
    elError.style.display   = 'none';
    elMain.style.display    = 'none';

    try {
      await carregarDados();
      elLoading.style.display = 'none';
      elMain.style.display    = 'block';
      buildDOM();
      setRound(0);
      setTimeout(iniciarReplay, 700);   // auto-play após pequena pausa
    } catch (err) {
      console.error('[Bolão] Erro:', err);
      elLoading.style.display = 'none';
      elError.style.display   = 'flex';
      document.getElementById('errorMsg').textContent =
        `Não foi possível carregar os dados. (${err.message})`;
    }
  }

  window.addEventListener('load', init);
  </script>

</body>
</html>
